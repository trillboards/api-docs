  # ==========================================
  # EARNINGS ENDPOINTS
  # ==========================================

  /earnings:
    get:
      tags:
        - Earnings
      summary: Get earnings summary
      description: |
        Get comprehensive earnings summary including lifetime earnings, current month,
        available balance, breakdown by source, and payout information.
      operationId: getEarnings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Earnings summary retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/EarningsResponse'
              example:
                success: true
                data:
                  total_lifetime_cents: 4500000
                  this_month_cents: 450000
                  available_for_payout_cents: 350000
                  pending_confirmation_cents: 125000
                  next_payout_estimate:
                    amount_cents: 350000
                    date: "2026-02-01"
                    stripe_status: "active"
                  breakdown:
                    direct_campaigns: 3000000
                    programmatic_google: 1200000
                    programmatic_floodgates: 300000
                  payout_threshold_cents: 10000
                  revenue_share_percent: 80
        '401':
          $ref: '#/components/responses/Unauthorized'

  /earnings/transactions:
    get:
      tags:
        - Earnings
      summary: Get transaction history
      description: |
        Get paginated list of earnings transactions and payouts.
        Transactions are aggregated by day showing impressions and calculated earnings.
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum transactions to return
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [all, earning, payout]
            default: all
      responses:
        '200':
          description: Transactions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
              example:
                success: true
                data:
                  transactions:
                    - id: "daily_2026-01-25"
                      type: "earning"
                      amount_cents: 15000
                      source: "impressions"
                      impressions: 5000
                      date: "2026-01-25"
                      created_at: "2026-01-25T00:00:00.000Z"
                    - id: "daily_2026-01-24"
                      type: "earning"
                      amount_cents: 14200
                      source: "impressions"
                      impressions: 4733
                      date: "2026-01-24"
                      created_at: "2026-01-24T00:00:00.000Z"
                  pagination:
                    total: 45
                    limit: 50
                    offset: 0
                    has_more: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  /earnings/breakdown:
    get:
      tags:
        - Earnings
      summary: Get detailed earnings breakdown
      description: |
        Get earnings breakdown grouped by day, week, or screen.
        Useful for detailed financial reporting and analysis.
      operationId: getEarningsBreakdown
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          description: Start date (ISO 8601 format)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: End date (ISO 8601 format)
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          description: How to group the breakdown
          schema:
            type: string
            enum: [day, week, screen]
            default: day
      responses:
        '200':
          description: Earnings breakdown retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/EarningsBreakdownResponse'
              example:
                success: true
                data:
                  summary:
                    total_cents: 450000
                    total_impressions: 150000
                    direct_cents: 450000
                    programmatic_cents: 0
                  breakdown:
                    - date: "2026-01-25"
                      impressions: 5000
                      earnings_cents: 15000
                    - date: "2026-01-24"
                      impressions: 4733
                      earnings_cents: 14200
                  pending_programmatic:
                    estimated_cents: 0
                    confirmation_date: null
                  period:
                    start: "2025-12-27T00:00:00.000Z"
                    end: "2026-01-26T23:59:59.999Z"
                    group_by: "day"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /earnings/payout:
    post:
      tags:
        - Earnings
      summary: Request a payout
      description: |
        Request a payout of available earnings to your connected Stripe account.
        Requires Stripe Connect onboarding to be complete.

        **Requirements:**
        - Stripe account must be connected and active
        - Available balance must meet minimum threshold ($100 default)
        - If `amount_cents` not specified, full available balance is requested
      operationId: requestPayout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: integer
                  description: Amount to payout in cents (optional, defaults to available balance)
                  minimum: 0
            example:
              amount_cents: 350000
      responses:
        '200':
          description: Payout request submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PayoutResponse'
              example:
                success: true
                message: "Payout request submitted"
                data:
                  payout_id: "po_1234567890_abc123"
                  amount_cents: 350000
                  status: "processing"
                  estimated_arrival: "2026-01-31"
                  stripe_transfer_id: null
        '400':
          description: Payout requirements not met
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Minimum payout is $100.00"
                  data:
                    type: object
                    properties:
                      available_cents:
                        type: integer
                      threshold_cents:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # TEAM MANAGEMENT ENDPOINTS
  # ==========================================

  /team/invite:
    post:
      tags:
        - Team
      summary: Invite a team member
      description: |
        Invite a new team member to join your partner organization.
        The invitee will receive an email with instructions to join.

        **Authorization:** Requires both partner API key AND user JWT with owner role.
        Include user JWT in `X-User-Token` header.

        **Roles:**
        - `admin` - Can manage screens, view analytics, configure webhooks
        - `viewer` - Can only view screen list and status
      operationId: inviteTeamMember
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-Token
          in: header
          required: true
          description: User JWT token for authorization
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the invitee
                role:
                  type: string
                  enum: [admin, viewer]
                  default: viewer
                  description: Role to assign to the team member
                name:
                  type: string
                  description: Optional name of the invitee
            example:
              email: "teammate@example.com"
              role: "viewer"
              name: "John Smith"
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/TeamInviteResponse'
              example:
                success: true
                message: "Invitation sent successfully"
                data:
                  membership_id: "507f1f77bcf86cd799439011"
                  email: "teammate@example.com"
                  role: "viewer"
                  status: "pending"
                  expires_at: "2026-02-02T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only owners can invite team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already has membership or pending invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team:
    get:
      tags:
        - Team
      summary: List team members
      description: |
        List all team members for the partner organization.
        Returns member info, roles, and permissions.
      operationId: listTeamMembers
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by membership status
          schema:
            type: string
            enum: [active, pending, all]
            default: active
      responses:
        '200':
          description: Team members retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamMember'
                      total:
                        type: integer
                      partner:
                        type: object
                        properties:
                          name:
                            type: string
                          slug:
                            type: string
              example:
                success: true
                data:
                  members:
                    - membership_id: "507f1f77bcf86cd799439011"
                      user_id: "507f1f77bcf86cd799439012"
                      email: "owner@example.com"
                      name: "Jane Owner"
                      photo: null
                      role: "owner"
                      status: "active"
                      invited_at: "2025-12-01T00:00:00.000Z"
                      accepted_at: "2025-12-01T00:00:00.000Z"
                      permissions:
                        view_screens: true
                        view_screen_status: true
                        view_analytics: true
                        view_earnings: true
                        manage_team: true
                    - membership_id: "507f1f77bcf86cd799439013"
                      user_id: "507f1f77bcf86cd799439014"
                      email: "viewer@example.com"
                      name: "John Viewer"
                      photo: null
                      role: "viewer"
                      status: "active"
                      invited_at: "2026-01-15T00:00:00.000Z"
                      accepted_at: "2026-01-15T12:00:00.000Z"
                      permissions:
                        view_screens: true
                        view_screen_status: true
                        view_analytics: false
                        view_earnings: false
                        manage_team: false
                  total: 2
                  partner:
                    name: "Acme Vending Co"
                    slug: "acmevending"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /team/{userId}:
    delete:
      tags:
        - Team
      summary: Remove a team member
      description: |
        Remove a team member from the partner organization.
        The owner cannot be removed.

        **Authorization:** Requires both partner API key AND user JWT with owner role.
      operationId: removeTeamMember
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID, membership ID, or email of the member to remove
          schema:
            type: string
        - name: X-User-Token
          in: header
          required: true
          description: User JWT token for authorization
          schema:
            type: string
      responses:
        '200':
          description: Team member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Team member removed successfully"
        '400':
          description: Cannot remove owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only owners can remove team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /team/{userId}/role:
    patch:
      tags:
        - Team
      summary: Change team member role
      description: |
        Change the role of a team member. Cannot change owner's role.

        **Authorization:** Requires both partner API key AND user JWT with owner role.
      operationId: changeTeamMemberRole
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID of the member
          schema:
            type: string
        - name: X-User-Token
          in: header
          required: true
          description: User JWT token for authorization
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [admin, viewer]
            example:
              role: "admin"
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      old_role:
                        type: string
                      new_role:
                        type: string
                      permissions:
                        $ref: '#/components/schemas/RolePermissions'
              example:
                success: true
                message: "Role changed from viewer to admin"
                data:
                  user_id: "507f1f77bcf86cd799439014"
                  old_role: "viewer"
                  new_role: "admin"
                  permissions:
                    view_screens: true
                    view_screen_status: true
                    view_analytics: true
                    view_impressions: true
                    view_earnings: false
                    edit_screens: true
                    manage_team: false
        '400':
          description: Cannot change owner's role or invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only owners can change roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /team/{membershipId}/resend:
    post:
      tags:
        - Team
      summary: Resend invitation
      description: |
        Resend the invitation email to a pending team member.
        Generates a new invitation token with extended expiry.

        **Authorization:** Requires both partner API key AND user JWT with owner role.
      operationId: resendInvitation
      security:
        - BearerAuth: []
      parameters:
        - name: membershipId
          in: path
          required: true
          description: Membership ID of the pending invitation
          schema:
            type: string
        - name: X-User-Token
          in: header
          required: true
          description: User JWT token for authorization
          schema:
            type: string
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
              example:
                success: true
                message: "Invitation resent successfully"
                data:
                  email: "teammate@example.com"
                  expires_at: "2026-02-02T00:00:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only owners can resend invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pending invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team/invite/{token}:
    get:
      tags:
        - Team
      summary: Get invitation details
      description: |
        Get details about an invitation by token.
        This is a public endpoint used during the signup flow.
      operationId: getInvitationByToken
      parameters:
        - name: token
          in: path
          required: true
          description: Invitation token from email link
          schema:
            type: string
      responses:
        '200':
          description: Invitation details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      partner:
                        type: object
                        properties:
                          name:
                            type: string
                          slug:
                            type: string
                      email:
                        type: string
                      role:
                        type: string
                      invited_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
              example:
                success: true
                data:
                  partner:
                    name: "Acme Vending Co"
                    slug: "acmevending"
                  email: "teammate@example.com"
                  role: "viewer"
                  invited_at: "2026-01-26T00:00:00.000Z"
                  expires_at: "2026-02-02T00:00:00.000Z"
        '404':
          description: Invalid or expired invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team/accept:
    post:
      tags:
        - Team
      summary: Accept team invitation
      description: |
        Accept a team invitation using the token from the invitation email.
        Can be called with or without authentication.

        **Without auth:** User with the invited email must exist
        **With auth:** Links invitation to the authenticated user's account
      operationId: acceptInvitation
      requestBody:
