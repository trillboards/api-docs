                  items:
                    type: object
                    required:
                      - adid
                      - impid
                    properties:
                      adid:
                        type: string
                      impid:
                        type: string
                      did:
                        type: string
                      sid:
                        type: string
                      aid:
                        type: string
                      duration:
                        type: integer
                      completed:
                        type: boolean
                      display_mode:
                        type: string
                        enum: [fullscreen, l-bar, pip]
                      display_area_ratio:
                        type: number
                      lbar_size:
                        type: number
                      lbar_position:
                        type: string
                        enum: [bottom, right]
                      lbar_slot_index:
                        type: integer
                      lbar_slot_count:
                        type: integer
                      sig:
                        type: string
                      sig_ts:
                        type: integer
                      timestamp:
                        type: string
                        format: date-time
                      device_fingerprint:
                        type: string
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      recorded:
                        type: integer
