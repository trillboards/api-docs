    AudienceSegment:
      type: object
      properties:
        object:
          type: string
          example: audience_segment
        id:
          type: string
        name:
          type: string
        description:
          type: string
        rules:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              operator:
                type: string
              value: {}
        is_active:
          type: boolean
        last_matched_count:
          type: integer
        last_matched_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        request_id:
          type: string

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string

  headers:
    X-RateLimit-Limit:
      description: The maximum number of requests allowed in the current time window
      schema:
        type: integer
        example: 200
    X-RateLimit-Remaining:
      description: The number of requests remaining in the current time window
      schema:
        type: integer
        example: 199
    X-RateLimit-Reset:
      description: Unix timestamp when the rate limit window resets
      schema:
        type: integer
        example: 1704067260
    RateLimit-Policy:
      description: IETF draft-7 rate limit policy (limit, remaining, reset combined)
      schema:
        type: string
        example: "200;w=60"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Missing required fields
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: API key required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Device not found
    PaymentRequired:
      description: Free tier exhausted — add a payment method to continue
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    example: "Free tier exhausted for data_api. Add a payment method to continue."
                  code:
                    type: string
                    enum: [payment_required]
                  type:
                    type: string
                    enum: [billing_error]
                  product:
                    type: string
                    description: Product that exhausted its free tier
                    enum: [data_api, proof_of_play, attribution, data_marketplace]
                  usage:
                    type: object
                    properties:
                      current:
                        type: integer
                        description: Current usage count this billing period
                        example: 12000
                      free_limit:
                        type: integer
                        description: Free tier limit per month
                        example: 10000
                      exceeded_by:
                        type: integer
                        description: How many units over the free limit
                        example: 2000
                  pricing:
                    type: object
                    description: Graduated pricing tiers for this product
                    nullable: true
                  billing_setup_url:
                    type: string
                    example: /v1/partner/billing/setup
                  pricing_url:
                    type: string
                    example: /v1/partner/pricing
                  help:
                    type: string
                    example: "POST /v1/partner/billing/setup with a Stripe payment method token to enable pay-per-use billing."
              request_id:
                type: string
                example: req_abc123
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: API rate limit exceeded. Maximum 200 requests per minute.
              retryAfter:
                type: integer
                example: 60
