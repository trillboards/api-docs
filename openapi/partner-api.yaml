      description: |
        Get real-time audience metrics for a screen including face detection,
        attention tracking, and demographic signals from the Troveworks AI pipeline.
      operationId: getAudienceMetrics
      security:
        - BearerAuth: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          description: Time period for metrics
          schema:
            type: string
            enum: [1h, 6h, 24h]
            default: 1h
        - name: include_history
          in: query
          description: Include historical data points
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Audience metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /audience-export:
    get:
      tags:
        - Analytics
      summary: Export audience data
      description: |
        Export aggregated audience data for multiple screens.
        Supports JSON and CSV formats.
      operationId: exportAudienceData
      security:
        - BearerAuth: []
      parameters:
        - name: screen_ids
          in: query
          required: true
          description: Comma-separated screen IDs (max 50)
          schema:
            type: string
        - name: start_date
          in: query
          description: Start date (ISO 8601)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: End date (ISO 8601)
          schema:
            type: string
            format: date
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: aggregation
          in: query
          description: Data aggregation level
          schema:
            type: string
            enum: [hourly, daily, weekly]
            default: daily
      responses:
        '200':
          description: Audience data exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceExportResponse'
            text/csv:
              schema:
                type: string
