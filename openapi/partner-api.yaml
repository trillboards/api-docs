                  partner:
                    id: "507f1f77bcf86cd799439011"
                    name: "Acme Vending Co"
                    slug: "acmevending"
                  role: "viewer"
                  permissions:
                    view_screens: true
                    view_screen_status: true
                    view_analytics: false
                  portal_url: "https://trillboards.com/earner"
        '400':
