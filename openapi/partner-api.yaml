          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already a member of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # EARNER UPGRADE ENDPOINT (Alternative Registration)
  # Note: This endpoint is at /v2/earner, not /v1/partner
  # ============================================

  /upgrade-to-partner:
    post:
      tags:
        - Partners
      summary: Self-service upgrade from Earner to Partner
      description: |
        **Base URL:** `https://api.trillboards.com/v2/earner` (not /v1/partner)

        Allows existing earners to upgrade to Partner status and receive an API key
        for programmatic screen management. This is an alternative to `/register` for
        users who already have a Trillboards earner account.

        **Authentication:** Requires user JWT token (not partner API key)

        **Use case:** An earner with existing screens wants to:
        - Register additional screens via API
        - Build a custom integration
        - Manage screens programmatically

        After upgrade:
        - User receives Partner API key (one-time display)
        - User can see both their existing (userId-based) screens AND new partner screens
        - Existing screens remain unchanged
        - New screens registered via API will have partner_id set

        **Rate limit:** 1 partner per user (prevents abuse)
      operationId: upgradeToPartner
      security:
        - UserJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partner_name
                - api_agreement_accepted
              properties:
                partner_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "Take 10 Media"
                  description: Name of the partner organization
                partner_slug:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                  maxLength: 50
                  example: "take10media"
                  description: |
                    URL-safe slug for the partner.
                    Auto-generated from partner_name if not provided.
                    Must be lowercase alphanumeric with hyphens.
                partner_type:
                  type: string
                  enum: [vending_machine, kiosk, digital_signage, retail_display, other]
                  default: digital_signage
                  description: Type of integration
                api_agreement_accepted:
                  type: boolean
                  description: Must be true to accept API terms of service
      responses:
        '201':
          description: Successfully upgraded to partner status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Successfully upgraded to partner status"
                  api_key:
                    type: string
                    example: "trb_partner_xxxxxxxxxxxxxxxxxxxx"
                    description: |
                      **IMPORTANT:** This is shown only once! Save it securely.
                      Cannot be retrieved after this response.
                  partner:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      slug:
                        type: string
                  portal_url:
                    type: string
                    example: "https://trillboards.com/earner/auth"
                  docs_url:
                    type: string
                    example: "https://api.trillboards.com/docs/partner"
                  warning:
                    type: string
                    example: "IMPORTANT: Save your API key now - it cannot be retrieved later."
        '400':
          description: Invalid request (missing partner_name or api_agreement_accepted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid user JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - user is not an earner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict - either:
            - User already owns a partner organization
            - Partner slug already taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  partner_slug:
                    type: string
                    description: If already an owner, shows existing partner slug
                  suggested_slug:
                    type: string
                    description: If slug taken, suggests alternative

  # ============================================
  # VAST INTEGRATION ENDPOINTS
  # For enterprise partners with existing video players
  # ============================================

  /vast/config:
    get:
      tags:
        - VAST Integration
      summary: Get VAST configuration for direct Google integration
      description: |
        Returns a VAST tag URL template that partners use to fetch ads directly from Google Ad Manager.

        **This is NOT a VAST proxy.** Trillboards provides the configuration; partners fetch VAST directly from Google.

        **Architecture:**
        1. Partner calls this endpoint (cached for 1 hour)
        2. Partner builds VAST URL using the template
        3. Partner fetches VAST directly from Google (`pubads.g.doubleclick.net`)
        4. Partner plays video in their player
        5. Partner reports impressions via `/tracking/batch`

        **Scale:** At 35,000 screens with 1-hour cache, this is ~10 requests/second (trivial load).

        **Security:** Partners only allowlist 2 domains: `api.trillboards.com` and `pubads.g.doubleclick.net`.
      operationId: getVastConfig
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: query
          description: Device identifier for targeting optimization
          schema:
            type: string
            example: "PARTNER-DEVICE-001"
        - name: screen_id
          in: query
          description: Screen ID for targeting (alternative to device_id)
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: VAST configuration returned successfully
          headers:
            Cache-Control:
              description: Caching directive (public, max-age=3600)
              schema:
                type: string
                example: "public, max-age=3600"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      vast_tag_template:
                        type: string
                        description: |
                          VAST URL template with placeholders for {width} and {height}.
                          Partner replaces placeholders and appends correlator.
                        example: "https://pubads.g.doubleclick.net/gampad/ads?iu=/105549217/Trillboards_Retail_Video&sz={width}x{height}&venuetype=2&..."
                      parameters:
                        type: object
                        properties:
                          width:
                            type: integer
                            example: 640
                          height:
                            type: integer
                            example: 480
                          venuetype:
                            type: integer
                            description: Venue type code for targeting
                            example: 2
                          min_duration:
                            type: integer
                            description: Minimum ad duration in seconds
                            example: 6
                          max_duration:
                            type: integer
                            description: Maximum ad duration in seconds
                            example: 300
                      ad_unit:
                        type: string
                        description: Google Ad Manager ad unit path
                        example: "/105549217/Trillboards_Retail_Video"
                      variant:
                        type: string
                        description: Configuration variant name for debugging
                        example: "default_retail"
                      floor_price_cpm:
                        type: integer
                        description: Floor price in cents (CPM)
                        example: 400
                      blocked_categories:
                        type: array
                        items:
                          type: string
                        description: IAB content categories to block
                        example: ["IAB25-3", "IAB26"]
                      timeout_ms:
                        type: integer
                        description: Recommended VAST fetch timeout
                        example: 12000
                      cache_ttl_seconds:
                        type: integer
                        description: How long to cache this config
                        example: 3600
                      tracking:
                        type: object
                        properties:
                          batch_endpoint:
                            type: string
                            example: "https://api.trillboards.com/v1/partner/tracking/batch"
                          single_endpoint:
                            type: string
                            example: "https://api.trillboards.com/v1/partner/impression"
                          max_batch_size:
                            type: integer
                            example: 100
                      integration_guide:
                        type: string
                        example: "https://api.trillboards.com/docs/partner/vast-integration"
              example:
                success: true
                data:
                  vast_tag_template: "https://pubads.g.doubleclick.net/gampad/ads?iu=/105549217/Trillboards_Retail_Video&sz={width}x{height}&venuetype=2&npa=0&..."
                  parameters:
                    width: 640
                    height: 480
                    venuetype: 2
                    min_duration: 6
                    max_duration: 300
                  ad_unit: "/105549217/Trillboards_Retail_Video"
                  variant: "default_retail"
                  floor_price_cpm: 400
                  blocked_categories: ["IAB25-3", "IAB26"]
                  timeout_ms: 12000
                  cache_ttl_seconds: 3600
                  tracking:
                    batch_endpoint: "https://api.trillboards.com/v1/partner/tracking/batch"
                    single_endpoint: "https://api.trillboards.com/v1/partner/impression"
                    max_batch_size: 100
                  integration_guide: "https://api.trillboards.com/docs/partner/vast-integration"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============================================
  # BATCH TRACKING ENDPOINTS
  # High-volume impression reporting with Ed25519 proofs
  # ============================================

  /tracking/batch:
    post:
      tags:
        - Batch Tracking
      summary: Record batch impressions with proof generation
      description: |
        High-volume endpoint for reporting multiple impressions in a single request.

        **Features:**
        - Process up to 100 impressions per batch
        - Ed25519 cryptographic proof for each impression
        - Duplicate detection (impressions with same impression_id + ad_id are ignored)
        - Optional audience metrics (face count, attention)

        **Batching Strategy:**
        - Buffer impressions client-side
        - Flush every 1-5 minutes or when buffer reaches 100
        - Handle failures with local retry queue

        **Proof Verification:**
        Each proof can be independently verified using the public key from `/tracking/.well-known/public-key`.
      operationId: recordTrackingBatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - impressions
              properties:
                impressions:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - device_id
                      - ad_id
                    properties:
                      device_id:
                        type: string
                        description: Partner's device identifier
                        example: "PARTNER-DEVICE-001"
                      ad_id:
                        type: string
                        description: Ad identifier from VAST response
                        example: "ima_1706745600_abc123"
                      event:
                        type: string
                        enum: [start, complete, error, firstQuartile, midpoint, thirdQuartile]
                        default: complete
                        description: VAST event type
                      timestamp:
                        type: string
                        format: date-time
                        description: When the event occurred (defaults to now)
                        example: "2026-01-31T10:00:00Z"
                      duration_ms:
                        type: integer
                        description: Video duration played in milliseconds
                        example: 15000
                      impression_id:
                        type: string
                        description: Optional client-generated ID (auto-generated if not provided)
                        example: "imp_client_abc123"
                      audience:
                        type: object
                        description: Optional audience metrics
                        properties:
                          face_count:
                            type: integer
                            description: Number of viewers detected
                            example: 3
                          attention:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            description: Attention score (0-1)
                            example: 0.87
                          dwell_time_ms:
                            type: integer
                            description: How long viewers were present
                            example: 45000
            example:
              impressions:
                - device_id: "PARTNER-DEVICE-001"
                  ad_id: "ima_1706745600_abc123"
                  event: "complete"
                  timestamp: "2026-01-31T10:00:00Z"
                  duration_ms: 15000
                  audience:
                    face_count: 3
                    attention: 0.87
                - device_id: "PARTNER-DEVICE-002"
                  ad_id: "ima_1706745600_def456"
                  event: "complete"
                  timestamp: "2026-01-31T10:00:05Z"
                  duration_ms: 30000
      responses:
        '200':
          description: Batch processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      processed:
                        type: integer
                        description: Number of impressions successfully recorded
                        example: 100
                      failed:
                        type: integer
                        description: Number of impressions that failed validation
                        example: 0
                      duplicates:
                        type: integer
                        description: Number of duplicate impressions skipped
                        example: 0
                      proofs:
                        type: array
                        description: Cryptographic proofs for each processed impression
                        items:
                          type: object
                          properties:
                            impression_id:
                              type: string
                              example: "imp_1706745600_a1b2c3"
                            signature:
                              type: string
                              description: Ed25519 signature (or SHA256 fallback)
                              example: "ed25519=7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d..."
                            public_key_id:
                              type: string
                              example: "pk_v2_001"
                      errors:
                        type: array
                        description: Details of failed impressions (max 10 shown)
                        items:
                          type: object
                          properties:
                            impression_id:
                              type: string
                            error:
                              type: string
                      processing_time_ms:
                        type: integer
                        description: Time to process the batch
                        example: 45
              example:
                success: true
                data:
                  processed: 2
                  failed: 0
                  duplicates: 0
                  proofs:
                    - impression_id: "imp_1706745600_a1b2c3"
                      signature: "ed25519=7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b"
                      public_key_id: "pk_v2_001"
                    - impression_id: "imp_1706745605_d4e5f6"
                      signature: "ed25519=8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c"
                      public_key_id: "pk_v2_001"
                  errors: []
                  processing_time_ms: 45
        '400':
          description: Invalid request (empty array, too many impressions, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty_array:
                  value:
                    success: false
                    message: "impressions array cannot be empty"
                too_many:
                  value:
                    success: false
                    message: "Maximum 100 impressions per batch"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tracking/.well-known/public-key:
    get:
      tags:
        - Batch Tracking
      summary: Get public key for proof verification
      description: |
        Returns the Ed25519 public key used to sign impression proofs.

        **No authentication required.** This is a public endpoint to enable third-party verification.

        **Verification Process:**
        1. Fetch public key from this endpoint
        2. Reconstruct canonical payload: `v2.{timestamp}.{adId}.{impressionId}.{screenId}.{deviceId}`
        3. Verify Ed25519 signature using the public key

        See `/tracking/batch` response for signature format.
      operationId: getTrackingPublicKey
      responses:
        '200':
          description: Public key information
          headers:
            Cache-Control:
              description: Caching directive (24 hours)
              schema:
                type: string
                example: "public, max-age=86400"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      publicKey:
                        type: string
                        nullable: true
                        description: Hex-encoded Ed25519 public key (null if using HMAC fallback)
                        example: "7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b"
                      algorithm:
                        type: string
                        enum: [ed25519, sha256]
                        description: Signature algorithm (ed25519 for public key, sha256 for HMAC fallback)
                        example: "ed25519"
                      version:
                        type: string
                        example: "v2"
                      keyId:
                        type: string
                        description: Key identifier for rotation support
                        example: "pk_v2_001"
                      verificationUrl:
                        type: string
                        example: "https://api.trillboards.com/v1/partner/tracking/verify"
                      documentation:
                        type: string
                        example: "https://api.trillboards.com/docs/proof-of-play"
              example:
                success: true
                data:
                  publicKey: "7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b"
                  algorithm: "ed25519"
                  version: "v2"
                  keyId: "pk_v2_001"
                  verificationUrl: "https://api.trillboards.com/v1/partner/tracking/verify"
                  documentation: "https://api.trillboards.com/docs/proof-of-play"

  # ────────────────────────────────────────────
  # Stripe Connect
  # ────────────────────────────────────────────

  /stripe/connect:
    post:
      tags:
        - Stripe Connect
      summary: Create Stripe Connect account
      description: |
        Creates a Stripe Connect Express account for the partner. If the partner already
        has a Stripe account, returns the existing account details with HTTP 200.
      operationId: createStripeConnectAccount
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Stripe Connect account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      account_id:
                        type: string
                        example: acct_1234567890
                      charges_enabled:
                        type: boolean
                      payouts_enabled:
                        type: boolean
                      details_submitted:
                        type: boolean
                      country:
                        type: string
                        example: US
                      default_currency:
                        type: string
                        example: usd
                      next_step:
                        type: string
                        nullable: true
        '200':
          description: Stripe account already exists
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Stripe API error

  /stripe/onboarding-link:
    get:
      tags:
        - Stripe Connect
      summary: Get Stripe onboarding link
      description: |
        Returns a temporary Stripe-hosted onboarding URL where the partner can
        complete identity verification and bank account setup.
      operationId: getStripeOnboardingLink
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Onboarding link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      onboarding_url:
                        type: string
                        format: uri
                      expires_at:
                        type: string
                        format: date-time
                      account_id:
                        type: string
                      instructions:
                        type: string
        '400':
          description: Partner has no Stripe account — call POST /stripe/connect first
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stripe/login-link:
    get:
      tags:
        - Stripe Connect
      summary: Get Stripe dashboard login link
      description: Returns a temporary link to the partner's Stripe Express dashboard.
      operationId: getStripeLoginLink
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Login link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      login_url:
                        type: string
                        format: uri
                      account_id:
                        type: string
                      instructions:
                        type: string
        '400':
          description: Partner has no Stripe account
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stripe/status:
    get:
      tags:
        - Stripe Connect
      summary: Get Stripe account status
      description: |
        Returns the current status of the partner's Stripe Connect account including
        onboarding requirements and payout readiness.
      operationId: getStripeAccountStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      has_account:
                        type: boolean
                      status:
                        type: string
                        enum: [not_connected, pending, active, restricted]
                      account_id:
                        type: string
                        nullable: true
                      charges_enabled:
                        type: boolean
                      payouts_enabled:
                        type: boolean
                      details_submitted:
                        type: boolean
                      country:
                        type: string
                      default_currency:
                        type: string
                      requirements:
                        type: object
                        properties:
                          currently_due:
                            type: array
                            items:
                              type: string
                          eventually_due:
                            type: array
                            items:
                              type: string
                          past_due:
                            type: array
                            items:
                              type: string
                          disabled_reason:
                            type: string
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stripe/payout:
    post:
      tags:
        - Stripe Connect
      summary: Request a payout
      description: |
        Initiates a payout transfer to the partner's Stripe Connect account.
        Minimum payout is $5.00 (500 cents). The partner must have an active
        Stripe account and sufficient available balance.
      operationId: requestStripePayout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount_cents
              properties:
                amount_cents:
                  type: integer
                  minimum: 500
                  description: Payout amount in cents (minimum $5.00)
                  example: 10000
                description:
                  type: string
                  description: Optional description for the payout
                idempotency_key:
                  type: string
                  description: Deduplication key to prevent duplicate payouts
      responses:
        '200':
          description: Payout initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payout of $100.00 initiated
                  data:
                    type: object
                    properties:
                      transfer_id:
                        type: string
                        example: tr_1234567890
                      amount_cents:
                        type: integer
                      currency:
                        type: string
                      destination:
                        type: string
                      status:
                        type: string
                        enum: [pending, reversed]
                      created:
                        type: string
                        format: date-time
                      description:
                        type: string
                      estimated_arrival:
                        type: string
                        format: date-time
                        description: Estimated arrival (2-3 business days)
        '400':
          description: Invalid amount, insufficient balance, or account not active
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stripe/payouts:
    get:
      tags:
        - Stripe Connect
      summary: Get payout history
      description: Returns a paginated list of past Stripe payouts for the partner.
      operationId: getStripePayoutHistory
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
          description: Maximum number of payouts to return
      responses:
        '200':
          description: Payout history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      transfers:
                        type: array
                        items:
                          type: object
                          properties:
                            transfer_id:
                              type: string
                            amount_cents:
                              type: integer
                            currency:
                              type: string
                            status:
                              type: string
                              enum: [completed, reversed]
                            created:
                              type: string
                              format: date-time
                            description:
                              type: string
                      has_more:
                        type: boolean
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stripe/webhook:
    post:
      tags:
        - Stripe Connect
      summary: Stripe webhook receiver
      description: |
        Receives webhook events from Stripe for Connect account updates and transfer status changes.
        This endpoint is called by Stripe, not by the partner. It uses Stripe signature verification.

        **Handled events:** `account.updated`, `transfer.created`, `transfer.paid`, `transfer.reversed`
      operationId: handleStripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe webhook event payload
      responses:
        '200':
          description: Webhook acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  event_type:
                    type: string

  # ────────────────────────────────────────────
  # Connect Dashboard
  # ────────────────────────────────────────────

  /connect/dashboard:
    get:
      tags:
        - Connect Dashboard
      summary: Get partner dashboard overview
      description: |
        Returns a comprehensive dashboard with screen counts, impression stats,
        earnings data, daily charts, and top-performing screens.
        Optimized for embedding in partner SDK dashboards.
      operationId: getConnectDashboard
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: ['7d', '30d', '90d']
            default: '30d'
          description: Time period for analytics data
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      partner:
                        type: object
                        properties:
                          name:
                            type: string
                          slug:
                            type: string
                          status:
                            type: string
                          stripe_status:
                            type: string
                            enum: [pending, active, restricted, not_connected]
                          revenue_share_percent:
                            type: number
                          cpm_cents:
                            type: number
                      screens:
                        type: object
                        properties:
                          total:
                            type: integer
                          online:
                            type: integer
                          offline:
                            type: integer
                          pending:
                            type: integer
                      impressions:
                        type: object
                        properties:
                          today:
                            type: integer
                          period:
                            type: integer
                          all_time:
                            type: integer
                          daily_average:
                            type: number
                          trend_percent:
                            type: number
                      earnings:
                        type: object
                        properties:
                          today_cents:
                            type: integer
                          period_cents:
                            type: integer
                          lifetime_cents:
                            type: integer
                          pending_payout_cents:
                            type: integer
                          available_cents:
                            type: integer
                          daily_average_cents:
                            type: integer
                      charts:
                        type: object
                        properties:
                          daily_impressions:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date
                                impressions:
                                  type: integer
                                earnings_cents:
                                  type: integer
                          hourly_today:
                            type: array
                            items:
                              type: object
                              properties:
                                hour:
                                  type: integer
                                  minimum: 0
                                  maximum: 23
                                impressions:
                                  type: integer
                      top_screens:
                        type: array
                        items:
                          type: object
                          properties:
                            screen_id:
                              type: string
                            name:
                              type: string
                            location:
                              type: string
                              nullable: true
                            status:
                              type: string
                              enum: [online, offline, unknown]
                            impressions:
                              type: integer
                            earnings_cents:
                              type: integer
                      period:
                        type: object
                        properties:
                          days:
                            type: integer
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connect/earnings:
    get:
      tags:
        - Connect Dashboard
      summary: Get earnings chart data
      description: Returns daily or weekly earnings breakdown for charting.
      operationId: getConnectEarningsChart
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: ['7d', '30d', '90d']
            default: '30d'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, week]
            default: day
      responses:
        '200':
          description: Earnings chart data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          total_impressions:
                            type: integer
                          total_earnings_cents:
                            type: integer
                          data_points:
                            type: integer
                          group_by:
                            type: string
                      chart:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            date:
                              type: string
                            impressions:
                              type: integer
                            earnings_cents:
                              type: integer
                            unique_screens:
                              type: integer
                            avg_view_duration_ms:
                              type: number
                      period:
                        type: object
                        properties:
                          days:
                            type: integer
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connect/health:
    get:
      tags:
        - Connect Dashboard
      summary: Get screen health status
      description: |
        Returns the online/offline status of all partner devices with heartbeat
        timestamps, uptime percentages, and location data.
      operationId: getConnectScreenHealth
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, all]
            default: all
          description: Filter by screen status
      responses:
        '200':
          description: Screen health data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          total:
                            type: integer
                          online:
                            type: integer
                          offline:
                            type: integer
                          never_connected:
                            type: integer
                      screens:
                        type: array
                        items:
                          type: object
                          properties:
                            device_id:
                              type: string
                            external_device_id:
                              type: string
                            fingerprint:
                              type: string
                            screen_id:
                              type: string
                              nullable: true
                            name:
                              type: string
                            status:
                              type: string
                              enum: [online, offline, never_connected, unknown]
                            screen_status:
                              type: string
                              enum: [pending, active, inactive]
                            last_heartbeat:
                              type: string
                              format: date-time
                              nullable: true
                            last_seen:
                              type: string
                              format: date-time
                              nullable: true
                            time_since_last_seen_seconds:
                              type: number
                              nullable: true
                            uptime_24h_percent:
                              type: number
                              nullable: true
                            location:
                              type: object
                              properties:
                                city:
                                  type: string
                                  nullable: true
                                state:
                                  type: string
                                  nullable: true
                                lat:
                                  type: number
                                  nullable: true
                                lng:
                                  type: number
                                  nullable: true
                            venue_type:
                              type: string
                              nullable: true
                            registered_at:
                              type: string
                              format: date-time
                      filter:
                        type: string
                      checked_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Fleet Management
  # ────────────────────────────────────────────

  /fleet/overview:
    get:
      tags:
        - Fleet Management
      summary: Get fleet overview
      description: |
        Returns a summary of all devices in the partner's fleet including
        online/offline counts, venue type distribution, and country breakdown.
      operationId: getFleetOverview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Fleet overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total_devices:
                        type: integer
                      online:
                        type: integer
                      offline:
                        type: integer
                      programmatic_enabled:
                        type: integer
                      venue_types:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          retail: 45
                          transit: 12
                          office: 8
                      countries:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          US: 50
                          CA: 10
        '401':
          $ref: '#/components/responses/Unauthorized'

  /fleet/analytics:
    get:
      tags:
        - Fleet Management
      summary: Get fleet analytics
      description: |
        Returns fleet-wide performance metrics for the last 24 hours including
        total impressions, fill rate, average CPM, and attention score.
      operationId: getFleetAnalytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Fleet analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      screen_count:
                        type: integer
                      impressions_24h:
                        type: integer
                      fill_rate_pct:
                        type: number
                        description: Fill rate percentage (0-100)
                      avg_cpm:
                        type: number
                        description: Average CPM in dollars
                      avg_attention:
                        type: number
                        description: Average attention score (0-1)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /fleet/command:
    post:
      tags:
        - Fleet Management
      summary: Push command to fleet
      description: |
        Sends a command to all devices in the fleet (or a filtered subset).
        Commands expire after 10 minutes. Maximum 500 devices per batch.
      operationId: pushFleetCommand
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
              properties:
                command:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum: [reload, update_settings, restart, screenshot, clear_cache, update_content, refresh_ads, update_config, get_state]
                    payload:
                      type: object
                      description: Command-specific data
                filter:
                  type: object
                  description: Optional filter to target specific devices
                  properties:
                    screenIds:
                      type: array
                      items:
                        type: string
                    venueType:
                      type: string
                    country:
                      type: string
      responses:
        '200':
          description: Command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      targeted:
                        type: integer
                        description: Total devices matching filter
                      queued:
                        type: integer
                        description: Devices successfully queued
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            screenId:
                              type: string
                            error:
                              type: string
        '400':
          description: Missing command.type
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /fleet/settings:
    post:
      tags:
        - Fleet Management
      summary: Update fleet-wide settings
      description: |
        Updates settings across all devices in the fleet (or a filtered subset).
        Settings are merged with existing values, not replaced.

        **Allowed settings:** `header_bidding_settings`, `content_preferences`, `display_settings`
      operationId: updateFleetSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - settings
              properties:
                settings:
                  type: object
                  description: Settings to update (merged with existing)
                  properties:
                    header_bidding_settings:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        allocation:
                          type: number
                        min_interval_seconds:
                          type: integer
                        force_request:
                          type: boolean
                    content_preferences:
                      type: object
                    display_settings:
                      type: object
                filter:
                  type: object
                  properties:
                    screenIds:
                      type: array
                      items:
                        type: string
                    venueType:
                      type: string
                    country:
                      type: string
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      targeted:
                        type: integer
                      updated:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: object
        '400':
          description: Empty settings or invalid keys
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ────────────────────────────────────────────
  # Venue Intelligence
  # ────────────────────────────────────────────

  /venues/{venueId}/intelligence:
    get:
      tags:
        - Venue Intelligence
      summary: Get venue intelligence report
      description: |
        Returns aggregated venue intelligence including multi-screen deduplication,
        timeseries data with demographics, weather context, and audience metrics.
        Maximum date range is 30 days.
      operationId: getVenueIntelligence
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
          description: Venue ID (MongoDB ObjectId)
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start date (ISO 8601)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End date (ISO 8601)
        - name: interval
          in: query
          schema:
            type: string
            enum: ['5min', '15min', '1h', '1d']
            default: '1h'
          description: Time bucket interval
      responses:
        '200':
          description: Venue intelligence data
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue_id:
                    type: string
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  interval:
                    type: string
                  dedup:
                    type: object
                    properties:
                      method:
                        type: string
                        enum: [lincoln_petersen, single_camera]
                      unique_total:
                        type: integer
                      raw_total:
                        type: integer
                      camera_count:
                        type: integer
                  summary:
                    type: object
                    properties:
                      total_unique_viewers:
                        type: integer
                      avg_attention:
                        type: number
                      buckets:
                        type: integer
                  timeseries:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket:
                          type: string
                          format: date-time
                        viewers:
                          type: integer
                          description: Deduplicated viewer count
                        raw_viewers:
                          type: integer
                        peak_viewers:
                          type: integer
                        avg_attention:
                          type: number
                        avg_engagement:
                          type: number
                        mood:
                          type: string
                          nullable: true
                        income_level:
                          type: string
                          nullable: true
                        age_distribution:
                          type: object
                          additionalProperties:
                            type: number
                        gender_distribution:
                          type: object
                          properties:
                            male:
                              type: number
                            female:
                              type: number
                        weather:
                          type: object
                          properties:
                            condition:
                              type: string
                              nullable: true
                            temperature_f:
                              type: number
                              nullable: true
                            is_raining:
                              type: boolean
                        brand_mention_windows:
                          type: integer
                        avg_noise_level:
                          type: number
                          nullable: true
                        measurements:
                          type: integer
                        screen_count:
                          type: integer
        '400':
          description: Missing or invalid parameters (from/to required, max 30 days)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Venue not found or not authorized

  # ────────────────────────────────────────────
  # Usage
  # ────────────────────────────────────────────

  /usage:
    get:
      tags:
        - Usage
      summary: Get API usage summary
      description: |
        Returns API usage statistics including total calls, error rates,
        top endpoints, and daily breakdown. Default range is 30 days, maximum 90 days.
      operationId: getUsageSummary
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: Start date (ISO 8601). Defaults to 30 days ago.
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: End date (ISO 8601). Defaults to now.
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: usage_summary
                  period:
                    type: object
                    properties:
                      start_date:
                        type: string
                        format: date-time
                      end_date:
                        type: string
                        format: date-time
                  totalCalls:
                    type: integer
                  totalErrors:
                    type: integer
                  errorRate:
                    type: number
                    description: Error rate percentage (0-100)
                  avgResponseTime:
                    type: number
                    description: Average response time in milliseconds
                  topEndpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint:
                          type: string
                        method:
                          type: string
                        total_calls:
                          type: integer
                        total_errors:
                          type: integer
                  dailyBreakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        total_calls:
                          type: integer
                        total_errors:
                          type: integer
                        avg_response_ms:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usage/dashboard:
    get:
      tags:
        - Usage
      summary: Get real-time usage dashboard
      description: |
        Returns a comprehensive usage dashboard with today's stats, rate limit status,
        and last 7 days breakdown. Combines real-time Redis data with historical MongoDB data.
      operationId: getUsageDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usage dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: usage_dashboard
                  today:
                    type: object
                    properties:
                      total_calls:
                        type: integer
                      total_errors:
                        type: integer
                      error_rate:
                        type: number
                      avg_response_ms:
                        type: number
                      top_endpoints:
                        type: array
                        items:
                          type: object
                          properties:
                            endpoint:
                              type: string
                            method:
                              type: string
                            total_calls:
                              type: integer
                            total_errors:
                              type: integer
                            avg_response_ms:
                              type: number
                  rate_limit:
                    type: object
                    properties:
                      current_rate:
                        type: integer
                      max_rate:
                        type: integer
                      window_seconds:
                        type: integer
                        example: 60
                      window_reset:
                        type: string
                        format: date-time
                      percent_used:
                        type: number
                  last_7_days:
                    type: object
                    properties:
                      total_calls:
                        type: integer
                      total_errors:
                        type: integer
                      error_rate:
                        type: number
                      avg_response_ms:
                        type: number
                      daily_breakdown:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            total_calls:
                              type: integer
                            total_errors:
                              type: integer
                            avg_response_ms:
                              type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usage/rate-limit:
    get:
      tags:
        - Usage
      summary: Get rate limit status
      description: |
        Returns the current rate limit status for the partner based on their data access tier.

        | Tier | Rate Limit |
        |------|-----------|
        | Basic | 200/min |
        | Developer | 1,000/min |
        | Enterprise | 5,000/min |
      operationId: getRateLimitStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Rate limit status
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: rate_limit_status
                  tier:
                    type: string
                    enum: [basic, developer, enterprise]
                  current_rate:
                    type: integer
                  max_rate:
                    type: integer
                  window_seconds:
                    type: integer
                    example: 60
                  window_reset:
                    type: string
                    format: date-time
                  percent_used:
                    type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # SSE Events
  # ────────────────────────────────────────────

  /events/stream:
    get:
      tags:
        - Events
      summary: Subscribe to real-time events (SSE)
      description: |
        Opens a Server-Sent Events (SSE) connection for real-time event streaming.
        Maximum 5 concurrent connections per partner.

        Supports `Last-Event-ID` header for reconnection and missed event replay.
        The server sends heartbeat comments (`:`) every 30 seconds to keep the connection alive.
      operationId: subscribeToEvents
      security:
        - BearerAuth: []
      parameters:
        - name: events
          in: query
          schema:
            type: string
          description: Comma-separated list of event types to subscribe to. Empty subscribes to all events.
          example: device.online,device.offline,impression.recorded
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE-formatted messages:
                  ```
                  event: device.online
                  id: evt_1234567890_abc123
                  data: {"device_id":"...","timestamp":"..."}
                  ```
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Maximum SSE connections reached (5 per partner)

  /events/connections:
    get:
      tags:
        - Events
      summary: List active SSE connections
      description: Returns the number of active SSE connections and their details.
      operationId: getActiveSSEConnections
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: sse_connections
                  count:
                    type: integer
                  max_connections:
                    type: integer
                    example: 5
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        connection_id:
                          type: string
                        subscribed_events:
                          type: array
                          items:
                            type: string
                        connected_at:
                          type: string
                          format: date-time
                        ip:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Network Config
  # ────────────────────────────────────────────

  /network-config:
    get:
      tags:
        - Network Config
      summary: Get network configuration
      description: Returns the partner's white-label network configuration and parent partner ID.
      operationId: getNetworkConfig
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Network configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: network_config
                  network_config:
                    type: object
                    properties:
                      default_content_preferences:
                        type: object
                      default_waterfall:
                        type: object
                      branding:
                        type: object
                  parent_partner_id:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Network Config
      summary: Update network configuration
      description: |
        Full update of network configuration. Each provided section is merged
        with the existing configuration (not replaced entirely).
      operationId: updateNetworkConfig
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_content_preferences:
                  type: object
                  description: Default content preferences for new screens
                default_waterfall:
                  type: object
                  description: Default waterfall/ad serving configuration
                branding:
                  type: object
                  description: White-label branding settings
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: network_config
                  network_config:
                    type: object
                  parent_partner_id:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Network Config
      summary: Partial update network configuration
      description: |
        Partial update of specific fields within the network configuration.
        Only the provided nested keys are updated; unmentioned keys are preserved.

        **Accepted top-level keys:** `default_content_preferences`, `default_waterfall`, `branding`
      operationId: patchNetworkConfig
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_content_preferences:
                  type: object
                default_waterfall:
                  type: object
                branding:
                  type: object
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: network_config
                  network_config:
                    type: object
                  parent_partner_id:
                    type: string
                    nullable: true
        '400':
          description: No valid fields to update
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Quick Start
  # ────────────────────────────────────────────

  /quick-start:
    post:
      tags:
        - Partners
      summary: Quick start — register partner and first device in one call
      description: |
        Registers a new partner and creates their first device in a single API call.
        Returns API key, device credentials, SDK snippets, and configuration.

        **Rate limited:** 5 requests per hour per IP address.

        **Important:** The API key is only shown once in the response. Store it securely!
      operationId: quickStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company_name
                - email
              properties:
                company_name:
                  type: string
                  description: Company or partner name
                  example: Acme Screens Inc
                email:
                  type: string
                  format: email
                  example: developer@acme.com
                device_name:
                  type: string
                  description: Name for the first device
                partner_type:
                  type: string
                  default: digital_signage
                device_location:
                  type: object
                  description: Location for the first device
                device_display:
                  type: object
                  description: Display configuration for the first device
      responses:
        '201':
          description: Partner registered and first device created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      partner:
                        type: object
                        properties:
                          partner_id:
                            type: string
                          name:
                            type: string
                          slug:
                            type: string
                          status:
                            type: string
                            example: active
                          revenue_share_percent:
                            type: number
                      credentials:
                        type: object
                        properties:
                          api_key:
                            type: string
                            description: Store securely — shown only once!
                            example: trb_partner_a1b2c3d4e5f6g7h8
                          api_key_prefix:
                            type: string
                          warning:
                            type: string
                      device:
                        type: object
                        properties:
                          device_id:
                            type: string
                          external_device_id:
                            type: string
                          fingerprint:
                            type: string
                          screen_id:
                            type: string
                          name:
                            type: string
                          status:
                            type: string
                          embed_url:
                            type: string
                            format: uri
                      integration:
                        type: object
                        properties:
                          sdk_snippet:
                            type: string
                          iframe_snippet:
                            type: string
                          embed_url:
                            type: string
                            format: uri
                          api_base:
                            type: string
                          sdk_url:
                            type: string
                          docs_url:
                            type: string
                      sdk_config:
                        type: object
                        properties:
                          ad_interval:
                            type: integer
                          max_ads_per_hour:
                            type: integer
                          image_duration:
                            type: integer
                          allowed_ad_types:
                            type: array
                            items:
                              type: string
                          sound_enabled:
                            type: boolean
                          cache_size:
                            type: integer
                      next_steps:
                        type: array
                        items:
                          type: string
        '400':
          description: Missing company_name or email
        '409':
          description: Partner with this email already exists
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ────────────────────────────────────────────
  # API Key Rotation
  # ────────────────────────────────────────────

  /api-key/rotate:
    post:
      tags:
        - Partners
      summary: Rotate API key
      description: |
        Generates a new API key with a 24-hour grace period for the old key.
        Both keys work during the grace period, after which the old key is invalidated.

        **Important:** The new API key is only shown once. Store it securely!
      operationId: rotateApiKey
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      api_key:
                        type: string
                        description: New API key — shown only once!
                        example: trb_partner_new_key_abc123
                      previous_key_expires_at:
                        type: string
                        format: date-time
                        description: When the old key stops working
                      grace_period_hours:
                        type: integer
                        example: 24
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Device Command Acknowledgment
  # ────────────────────────────────────────────

  /device/{deviceId}/commands/{commandId}/ack:
    post:
      tags:
        - Devices
      summary: Acknowledge a device command
      description: |
        Acknowledges receipt and execution of a command sent to a device.
        Typically called by the SDK/device after processing a fleet command.
      operationId: ackDeviceCommand
      security: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: Device identifier (fingerprint or external ID)
        - name: commandId
          in: path
          required: true
          schema:
            type: string
          description: Command ID to acknowledge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  default: acked
                  description: Acknowledgment status
                result:
                  type: object
                  description: Command execution result
      responses:
        '200':
          description: Command acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Command acknowledged
        '403':
          description: Command does not belong to this device
        '404':
          description: Device or command not found

  # ────────────────────────────────────────────
  # Sandbox (Beta)
  # ────────────────────────────────────────────

  /sandbox/screen:
    post:
      tags:
        - Sandbox
      summary: Create a sandbox screen
      description: |
        Creates a synthetic test screen with realistic data for integration testing.
        Maximum 10 sandbox screens per partner. Sandbox data expires after 24 hours.
      operationId: createSandboxScreen
      x-beta: true
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Custom screen name
                venue_type:
                  type: string
                  description: Override venue type
      responses:
        '201':
          description: Sandbox screen created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: sandbox_screen
                  id:
                    type: string
                    example: sandbox_screen_abc123
                  screen_id:
                    type: string
                  partner_id:
                    type: string
                  is_sandbox:
                    type: boolean
                    example: true
                  name:
                    type: string
                  fingerprint:
                    type: string
                  device_id:
                    type: string
                  status:
                    type: string
                    example: online
                  location:
                    type: object
                    properties:
                      name:
                        type: string
                      latitude:
                        type: number
                      longitude:
                        type: number
                      city:
                        type: string
                      state:
                        type: string
                      venue_type:
                        type: string
                  display_settings:
                    type: object
                  audience:
                    type: object
                    properties:
                      current_viewers:
                        type: integer
                      avg_dwell_time_sec:
                        type: number
                      demographics:
                        type: object
                  created_at:
                    type: string
                    format: date-time
                  last_heartbeat:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Maximum 10 sandbox screens per partner

  /sandbox/event:
    post:
      tags:
        - Sandbox
      summary: Generate a test event
      description: |
        Generates a realistic test event that can be used to validate webhook integrations.
        If an SSE connection is active, the event is also delivered via SSE.

        **Supported event types:** `device.online`, `device.offline`, `impression.recorded`,
        `impression.verified`, `campaign.allocated`, `payout.processed`, `audience.spike`,
        `audience.demographics_update`, `audience.purchase_intent`, `audience.venue_busy`,
        `audience.context_update`, `venue.traffic_summary`, `auction.completed`, `bid.won`,
        `bid.lost`, `creative.performance`, `screen.anomaly_detected`
      operationId: generateSandboxEvent
      x-beta: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_type
              properties:
                event_type:
                  type: string
                  description: Event type to generate
                  example: impression.recorded
                screen_id:
                  type: string
                  description: Target sandbox screen (auto-selects first if omitted)
      responses:
        '201':
          description: Test event generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: sandbox_event
                  event_id:
                    type: string
                  event:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  is_sandbox:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Event payload (varies by event type)
                  screen_id:
                    type: string
                    nullable: true
                  sse_delivered:
                    type: integer
                    description: Number of SSE connections that received this event
        '400':
          description: Missing or invalid event_type
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sandbox/reset:
    post:
      tags:
        - Sandbox
      summary: Reset sandbox data
      description: Clears all sandbox screens and events for the partner.
      operationId: resetSandbox
      x-beta: true
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sandbox reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: sandbox_reset
                  success:
                    type: boolean
                    example: true
                  screens_cleared:
                    type: integer
                  events_cleared:
                    type: integer
                  reset_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sandbox/status:
    get:
      tags:
        - Sandbox
      summary: Get sandbox status
      description: Returns current sandbox screens, event counts, and recent activity.
      operationId: getSandboxStatus
      x-beta: true
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sandbox status
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: sandbox_status
                  sandbox_screens:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        location:
                          type: object
                        last_heartbeat:
                          type: string
                          format: date-time
                        created_at:
                          type: string
                          format: date-time
                  total_screens:
                    type: integer
                  total_test_events:
                    type: integer
                  last_activity:
                    type: string
                    format: date-time
                    nullable: true
                  recent_events:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id:
                          type: string
                        event:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Audience Intelligence (Beta)
  # ────────────────────────────────────────────

  /audience/live/{screenId}:
    get:
      tags:
        - Audience Intelligence
      summary: Get live audience data for a screen
      description: |
        Returns real-time audience data including face count, attention score, mood,
        demographics, purchase intent, and crowd density. Available to all tiers.
      operationId: getLiveAudience
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Live audience data
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_live
                  screen_id:
                    type: string
                  status:
                    type: string
                    enum: [live, offline]
                  audience:
                    type: object
                    nullable: true
                    description: Null when screen is offline
                    properties:
                      face_count:
                        type: integer
                      attention_score:
                        type: number
                      income_level:
                        type: string
                        nullable: true
                      mood:
                        type: string
                        nullable: true
                      lifestyle_segment:
                        type: string
                        nullable: true
                      emotional_engagement:
                        type: number
                        nullable: true
                      ad_receptivity:
                        type: number
                        nullable: true
                      dwell_time_ms:
                        type: number
                        nullable: true
                      occupancy:
                        type: string
                        nullable: true
                      noise_level:
                        type: number
                        nullable: true
                      purchase_intent:
                        type: string
                        nullable: true
                        enum: [NONE, BROWSING, CONSIDERING, COMPARING, READY_TO_BUY]
                      crowd_density:
                        type: number
                      dominant_ambience:
                        type: string
                        nullable: true
                  last_updated:
                    type: string
                    format: date-time
                    nullable: true
                  message:
                    type: string
                    description: Present when screen is offline
                  request_id:
                    type: string
        '404':
          description: Screen not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audience/heatmap:
    get:
      tags:
        - Audience Intelligence
      summary: Get audience heatmap data
      description: |
        Returns geospatial audience heatmap data across partner screens.
        Available to all tiers.
      operationId: getAudienceHeatmap
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: screen_ids
          in: query
          schema:
            type: string
          description: Comma-separated screen IDs to include (omit for all screens)
        - name: days
          in: query
          schema:
            type: integer
            default: 14
          description: Lookback period in days
      responses:
        '200':
          description: Heatmap data
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_heatmap
                  screens_included:
                    type: integer
                  lookback_days:
                    type: integer
                  cells:
                    type: integer
                  heatmap:
                    type: array
                    items:
                      type: object
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audience/stats:
    get:
      tags:
        - Audience Intelligence
      summary: Get audience data statistics
      description: |
        Returns high-level statistics about audience data availability for the partner's screens.
        Available to all tiers.
      operationId: getAudienceStats
      x-beta: true
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audience stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_stats
                  total_screens:
                    type: integer
                  screens_with_data:
                    type: integer
                  total_vectors:
                    type: integer
                  oldest_data:
                    type: string
                    format: date-time
                    nullable: true
                  newest_data:
                    type: string
                    format: date-time
                    nullable: true
                  data_access_tier:
                    type: string
                    enum: [basic, developer, enterprise]
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audience/lookalikes/{screenId}:
    get:
      tags:
        - Audience Intelligence
      summary: Find lookalike screens
      description: |
        Finds screens with similar audience profiles using vector similarity search.
        **Requires Developer tier or above.**
      operationId: getLookalikeScreens
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
          description: Source screen to find lookalikes for
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum number of matches
        - name: country
          in: query
          schema:
            type: string
          description: Filter by country
        - name: venue_type
          in: query
          schema:
            type: string
          description: Filter by venue type
        - name: min_similarity
          in: query
          schema:
            type: number
            default: 0.7
          description: Minimum similarity score (0-1)
      responses:
        '200':
          description: Lookalike matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_lookalike
                  source_screen_id:
                    type: string
                  matches_count:
                    type: integer
                  filters:
                    type: object
                    properties:
                      country:
                        type: string
                        nullable: true
                      venue_type:
                        type: string
                        nullable: true
                      min_similarity:
                        type: number
                  matches:
                    type: array
                    items:
                      type: object
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Developer tier
        '404':
          description: Screen not found

  /audience/predict/{screenId}:
    get:
      tags:
        - Audience Intelligence
      summary: Predict screen audience
      description: |
        Predicts audience composition for a specific hour and day of week
        using historical data. **Requires Developer tier or above.**
      operationId: predictScreenAudience
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
        - name: hour
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 23
          description: Hour of day (UTC)
        - name: day
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
          description: Day of week (0=Sunday, 6=Saturday)
        - name: lookback_days
          in: query
          schema:
            type: integer
            default: 30
          description: Historical lookback period in days
      responses:
        '200':
          description: Audience prediction
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_prediction
                  screen_id:
                    type: string
                  hour_utc:
                    type: integer
                  day_of_week:
                    type: integer
                  lookback_days:
                    type: integer
                  prediction:
                    type: object
                    nullable: true
                    description: Null if insufficient historical data
                  message:
                    type: string
                    description: Present when prediction is null
                  request_id:
                    type: string
        '400':
          description: Invalid hour or day values
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Developer tier
        '404':
          description: Screen not found

  # ────────────────────────────────────────────
  # Audience Segments (Beta — Enterprise tier)
  # ────────────────────────────────────────────

  /audience/segments:
    post:
      tags:
        - Audience Segments
      summary: Create audience segment
      description: |
        Creates a custom audience segment based on rules (demographics, venue type, geography, etc.).
        **Requires Enterprise tier.**
      operationId: createAudienceSegment
      x-beta: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - rules
              properties:
                name:
                  type: string
                  description: Segment name
                  example: High-Income Urban Millennials
                description:
                  type: string
                rules:
                  type: array
                  items:
                    type: object
                    required:
                      - field
                      - operator
                      - value
                    properties:
                      field:
                        type: string
                        description: Rule field (e.g., venue_type, country, city, state)
                      operator:
                        type: string
                        description: Comparison operator (e.g., eq, neq, in, gt, lt)
                      value:
                        description: Rule value
      responses:
        '201':
          description: Segment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceSegment'
        '400':
          description: Validation error (missing name, invalid rules)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '409':
          description: Duplicate segment name
        '429':
          description: Segment limit exceeded
    get:
      tags:
        - Audience Segments
      summary: List audience segments
      description: |
        Returns all audience segments for the partner.
        **Requires Enterprise tier.**
      operationId: listAudienceSegments
      x-beta: true
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Segment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudienceSegment'
                  total_count:
                    type: integer
                  has_more:
                    type: boolean
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier

  /audience/segments/{segmentId}:
    get:
      tags:
        - Audience Segments
      summary: Get audience segment
      description: |
        Returns a single audience segment by ID.
        **Requires Enterprise tier.**
      operationId: getAudienceSegment
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Segment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceSegment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '404':
          description: Segment not found
    patch:
      tags:
        - Audience Segments
      summary: Update audience segment
      description: |
        Partially updates an audience segment. All fields are optional.
        **Requires Enterprise tier.**
      operationId: updateAudienceSegment
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                      value: {}
                is_active:
                  type: boolean
      responses:
        '200':
          description: Segment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceSegment'
        '400':
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '404':
          description: Segment not found
        '409':
          description: Duplicate segment name
    delete:
      tags:
        - Audience Segments
      summary: Delete audience segment
      description: |
        Permanently deletes an audience segment.
        **Requires Enterprise tier.**
      operationId: deleteAudienceSegment
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Segment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_segment
                  id:
                    type: string
                  deleted:
                    type: boolean
                    example: true
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '404':
          description: Segment not found

  /audience/segments/{segmentId}/match:
    post:
      tags:
        - Audience Segments
      summary: Match screens to segment
      description: |
        Finds screens whose audience matches the segment rules.
        **Requires Enterprise tier.**
      operationId: matchAudienceSegment
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: own_screens_only
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
          description: Only match screens owned by this partner
      responses:
        '200':
          description: Matching screens
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: audience_segment
                  segment_id:
                    type: string
                  segment_name:
                    type: string
                  matched_count:
                    type: integer
                  own_screens_only:
                    type: boolean
                  matches:
                    type: array
                    items:
                      type: object
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '404':
          description: Segment not found

  /audience/segments/{segmentId}/reach:
    post:
      tags:
        - Audience Segments
      summary: Estimate segment reach
      description: |
        Estimates the potential reach of a segment including matched screens,
        projected daily impressions, and estimated revenue.
        **Requires Enterprise tier.**
      operationId: estimateSegmentReach
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
        - name: own_screens_only
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: Reach estimation
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: segment_reach
                  segment_id:
                    type: string
                  segment_name:
                    type: string
                  matched_screens:
                    type: integer
                  online_screens:
                    type: integer
                  estimated_daily_impressions:
                    type: integer
                  estimated_daily_cpm:
                    type: number
                  estimated_daily_revenue:
                    type: number
                  venue_breakdown:
                    type: object
                    additionalProperties:
                      type: integer
                  country_breakdown:
                    type: object
                    additionalProperties:
                      type: integer
                  has_historical_data:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '404':
          description: Segment not found

  /audience/segments/{segmentId}/vast-tag:
    post:
      tags:
        - Audience Segments
      summary: Generate VAST tag for segment
      description: |
        Generates a VAST tag URL targeting screens that match the segment rules.
        **Requires Enterprise tier.**
      operationId: generateSegmentVastTag
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - creative_url
              properties:
                creative_url:
                  type: string
                  format: uri
                  description: Video creative URL
                duration:
                  type: integer
                  minimum: 5
                  maximum: 120
                  default: 15
                  description: Video duration in seconds
                click_through:
                  type: string
                  format: uri
                  description: Click-through landing page URL
                own_screens_only:
                  type: boolean
                  default: false
      responses:
        '200':
          description: VAST tag generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: segment_vast_tag
                  segment_id:
                    type: string
                  segment_name:
                    type: string
                  vast_tag_url:
                    type: string
                    format: uri
                  targeted_screens:
                    type: integer
                  screen_ids:
                    type: array
                    items:
                      type: string
                  cust_params:
                    type: array
                    items:
                      type: string
                  creative:
                    type: object
                    properties:
                      url:
                        type: string
                      duration:
                        type: integer
                      click_through:
                        type: string
                        nullable: true
        '400':
          description: Missing creative_url
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Requires Enterprise tier
        '404':
          description: Segment not found

  # ────────────────────────────────────────────
  # Intent Catalog (Beta)
  # ────────────────────────────────────────────

  /intent/categories:
    get:
      tags:
        - Intent Catalog
      summary: List intent categories
      description: |
        Returns the catalog of purchase intent categories with CPM multipliers
        and matching thresholds.
      operationId: listIntentCategories
      x-beta: true
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Intent categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: active_purchase_intent
                        name:
                          type: string
                          example: Active Purchase Intent
                        description:
                          type: string
                        premium_multiplier:
                          type: number
                          description: CPM multiplier applied when this intent is detected
                          example: 5.0
                        min_intent_score:
                          type: number
                          description: Minimum intent score to match this category
                          example: 0.8
                        purchase_stages:
                          type: array
                          items:
                            type: string
                            enum: [READY_TO_BUY, COMPARING, CONSIDERING, BROWSING]
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /intent/categories/{categoryId}:
    get:
      tags:
        - Intent Catalog
      summary: Get intent category details
      description: Returns detailed information about a specific intent category including triggers.
      operationId: getIntentCategory
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
          example: active_purchase_intent
      responses:
        '200':
          description: Intent category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: intent_category
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  triggers:
                    type: array
                    items:
                      type: string
                  premium_multiplier:
                    type: number
                  min_intent_score:
                    type: number
                  purchase_stages:
                    type: array
                    items:
                      type: string
                  iab_segments:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Intent category not found

  /intent/pricing/{screenId}:
    get:
      tags:
        - Intent Catalog
      summary: Get intent-based pricing for a screen
      description: |
        Returns real-time intent-based pricing for a specific screen based on
        current audience signals (speech, emotion, behavior). Includes the detected
        intent category, purchase stage, and premium CPM.
      operationId: getIntentPricing
      x-beta: true
      security:
        - BearerAuth: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent pricing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: intent_pricing
                  screen_id:
                    type: string
                  current_intent:
                    type: object
                    properties:
                      score:
                        type: number
                        description: Intent confidence score (0-1)
                      purchase_stage:
                        type: string
                        enum: [NONE, BROWSING, CONSIDERING, COMPARING, READY_TO_BUY]
                      categories:
                        type: array
                        items:
                          type: string
                      should_trigger:
                        type: boolean
                        description: Whether an ad swap should be triggered
                  category_match:
                    type: object
                    nullable: true
                    properties:
                      category_id:
                        type: string
                      category_name:
                        type: string
                      premium_multiplier:
                        type: number
                      intent_score:
                        type: number
                      purchase_stage:
                        type: string
                  pricing:
                    type: object
                    properties:
                      base_cpm:
                        type: number
                      premium_multiplier:
                        type: number
                      intent_cpm:
                        type: number
                        description: Effective CPM after intent premium
                      intent_premium:
                        type: number
                        description: Additional CPM from intent detection
                      category_id:
                        type: string
                      category_name:
                        type: string
        '400':
          description: Invalid screen ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Screen not found

  # ────────────────────────────────────────────
  # Billing & Pricing
  # ────────────────────────────────────────────

  /pricing:
    get:
      tags:
        - Billing
      summary: Get machine-readable pricing
      description: |
        Returns full pricing information for all Trillboards products including
        graduated usage tiers, free tier thresholds, committed-use discounts,
        and billing setup URLs. No authentication required — designed for
        programmatic price discovery by AI agents and DSPs.

        Response is cached for 1 hour (Cache-Control: public, max-age=3600).
      operationId: getPricing
      security: []
      responses:
        '200':
          description: Pricing information
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=3600"
            Link:
              schema:
                type: string
                example: '</.well-known/adagents.json>; rel="adcp-discovery"'
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: pricing
                  model:
                    type: string
                    example: usage_based
                  currency:
                    type: string
                    example: usd
                  description:
                    type: string
                    example: "Pay-per-use with generous free tiers. No subscriptions, no commitments."
                  products:
                    type: object
                    description: Pricing details per product
                    properties:
                      partner_platform:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          pricing:
                            type: string
                          revenue_share:
                            type: object
                            properties:
                              earner:
                                type: number
                              platform:
                                type: number
                              distributor:
                                type: number
                      data_api:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          unit:
                            type: string
                          tiers:
                            type: array
                            items:
                              type: object
                              properties:
                                up_to:
                                  type: integer
                                  nullable: true
                                  description: "null means unlimited (final tier)"
                                unit_price_usd:
                                  type: number
                          notes:
                            type: string
                      proof_of_play:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          unit:
                            type: string
                          tiers:
                            type: array
                            items:
                              type: object
                              properties:
                                up_to:
                                  type: integer
                                  nullable: true
                                unit_price_usd:
                                  type: number
                          notes:
                            type: string
                      attribution:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          meters:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                unit_price_usd:
                                  type: number
                                per_unit:
                                  type: string
                                first_campaign_free:
                                  type: boolean
                      data_marketplace:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          meters:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                unit_price_usd:
                                  type: number
                                per_unit:
                                  type: string
                                free_quota_per_month:
                                  type: integer
                          revenue_share:
                            type: object
                          notes:
                            type: string
                      programmatic:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          pricing:
                            type: string
                      fein_edge_ai:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          pricing:
                            type: string
                  committed_use:
                    type: object
                    description: Volume discount tiers for prepaid credits
                    additionalProperties:
                      type: object
                      properties:
                        price_usd:
                          type: number
                        credits_usd:
                          type: number
                        discount_pct:
                          type: number
                  free_tiers:
                    type: object
                    description: Free tier limits per product and meter
                  billing_setup_url:
                    type: string
                    example: /v1/partner/billing/setup
                  agent_register_url:
                    type: string
                    example: /v1/partner/agent/register
                  request_id:
                    type: string
              example:
                object: pricing
                model: usage_based
                currency: usd
                description: "Pay-per-use with generous free tiers. No subscriptions, no commitments."
                request_id: req_abc123

  /billing/setup:
    post:
      tags:
        - Billing
      summary: Set up usage-based billing
      description: |
        Attaches a Stripe payment method to your partner account and activates
        pay-per-use billing. Required after exceeding free tier limits.

        After setup, usage beyond free tiers is metered and invoiced monthly.
        You can also purchase committed-use credits for volume discounts.
      operationId: setupBilling
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_method_id
              properties:
                payment_method_id:
                  type: string
                  description: Stripe payment method token obtained from Stripe.js or Stripe Elements
                  example: pm_1OxABC123def456
            example:
              payment_method_id: pm_1OxABC123def456
      responses:
        '201':
          description: Billing activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: billing_setup
                  stripe_customer_id:
                    type: string
                    example: cus_ABC123
                  billing_status:
                    type: string
                    example: active
                  message:
                    type: string
                    example: "Billing is now active. Usage beyond free tiers will be invoiced monthly."
                  request_id:
                    type: string
        '400':
          description: Invalid or missing payment method
        '401':
          $ref: '#/components/responses/Unauthorized'

  /billing/usage-summary:
    get:
      tags:
        - Billing
      summary: Get current billing period usage
      description: |
        Returns usage summary for the current billing period including per-product
        breakdown, free tier consumption, paid usage, credit balance, and total cost.
      operationId: getUsageSummary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: usage_summary
                  billing_status:
                    type: string
                    enum: [none, active, suspended]
                    description: Current billing status
                  credit_balance_cents:
                    type: integer
                    description: Remaining prepaid credit balance in cents
                    example: 62500
                  period_start:
                    type: string
                    format: date-time
                    description: Start of current billing period
                  period_end:
                    type: string
                    format: date-time
                    description: End of current billing period
                  products:
                    type: object
                    description: Per-product usage breakdown
                    additionalProperties:
                      type: object
                      properties:
                        meters:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              usage:
                                type: integer
                              free_quota:
                                type: integer
                              billable:
                                type: integer
                              cost_cents:
                                type: integer
                  total_cost_cents:
                    type: integer
                    description: Total cost in cents for current period
                    example: 4500
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /billing/credits:
    post:
      tags:
        - Billing
      summary: Purchase committed-use credits
      description: |
        Immediately charges the partner's payment method and adds credits at a discount.

        Available tiers:
        | Tier | Price | Credits | Discount |
        |------|-------|---------|----------|
        | tier_500 | $500 | $625 | 25% |
        | tier_2000 | $2,000 | $3,100 | 55% |
        | tier_5000 | $5,000 | $10,000 | 100% |

        Requires an active billing setup (payment method attached).
      operationId: purchaseCredits
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tier
              properties:
                tier:
                  type: string
                  enum: [tier_500, tier_2000, tier_5000]
                  description: Credit purchase tier
            example:
              tier: tier_2000
      responses:
        '201':
          description: Credits purchased
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: credit_purchase
                  payment_intent_id:
                    type: string
                    description: Stripe PaymentIntent ID
                    example: pi_ABC123
                  charged_cents:
                    type: integer
                    description: Amount charged in cents
                    example: 200000
                  credits_added_cents:
                    type: integer
                    description: Credits added to balance in cents
                    example: 310000
                  discount_pct:
                    type: number
                    description: Discount percentage applied
                    example: 55
                  request_id:
                    type: string
        '400':
          description: Invalid tier or billing not set up
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  /billing/credits/checkout:
    post:
      tags:
        - Billing
      summary: Create Stripe Checkout session for credits
      description: |
        Creates a Stripe Checkout session for purchasing committed-use credits.
        Redirect the user to the returned checkout_url to complete payment.
        Credits are automatically applied after successful payment via webhook.
      operationId: createCreditCheckout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tier
              properties:
                tier:
                  type: string
                  enum: [tier_500, tier_2000, tier_5000]
                success_url:
                  type: string
                  format: uri
                  description: URL to redirect after successful payment
                cancel_url:
                  type: string
                  format: uri
                  description: URL to redirect if payment is cancelled
            example:
              tier: tier_500
              success_url: "https://example.com/billing/success"
              cancel_url: "https://example.com/billing/cancel"
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: checkout_session
                  checkout_url:
                    type: string
                    format: uri
                    description: Stripe Checkout URL — redirect user here
                    example: "https://checkout.stripe.com/c/pay/cs_test_abc123"
                  session_id:
                    type: string
                    description: Stripe Checkout session ID
                    example: cs_test_abc123
                  message:
                    type: string
                    example: "Redirect the user to checkout_url to complete the purchase."
                  request_id:
                    type: string
        '400':
          description: Invalid tier
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agent/register:
    post:
      tags:
        - Agent Registration
      summary: Register an AI agent
      description: |
        Self-service registration for AI agents and automated systems. Returns an API key,
        MCP endpoint, sandbox screens for testing, and free tier information.

        No authentication required — designed for fully autonomous agent onboarding.
        Rate limited to 5 registrations per hour per IP.
      operationId: registerAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_type
                - name
                - email
              properties:
                agent_type:
                  type: string
                  enum: [dsp_agent, ssp_agent, trading_desk, analytics_platform, developer]
                  description: Type of agent being registered
                name:
                  type: string
                  description: Agent or company name
                  example: "My DSP Agent"
                email:
                  type: string
                  format: email
                  description: Contact email
                  example: agent@example.com
                company:
                  type: string
                  description: Company name (optional)
                description:
                  type: string
                  description: Brief description of the agent's purpose
            example:
              agent_type: dsp_agent
              name: "My DSP Agent"
              email: agent@example.com
              company: "Acme DSP"
              description: "Automated DOOH media buying agent"
      responses:
        '201':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: agent_registration
                  partner_id:
                    type: string
                    description: Unique partner ID
                  api_key:
                    type: string
                    description: API key for authentication (display once — save it!)
                    example: trb_partner_xxxxx
                  mcp_endpoint:
                    type: string
                    example: "https://api.trillboards.com/mcp/"
                  mcp_transport:
                    type: string
                    example: streamable-http
                  tools_url:
                    type: string
                    example: "https://api.trillboards.com/mcp/"
                  pricing_url:
                    type: string
                    example: "https://api.trillboards.com/v1/partner/pricing"
                  docs_url:
                    type: string
                    example: "https://api.trillboards.com/developer"
                  sandbox:
                    type: object
                    properties:
                      screens:
                        type: array
                        items:
                          type: object
                          properties:
                            device_id:
                              type: string
                            venue_type:
                              type: string
                            name:
                              type: string
                      note:
                        type: string
                  free_tiers:
                    type: object
                    description: Free tier limits per product
                  available_tools:
                    type: array
                    items:
                      type: string
                    description: MCP tools available to this agent
                  agent_type:
                    type: string
                  next_steps:
                    type: array
                    items:
                      type: string
                    description: Guidance for getting started
                  request_id:
                    type: string
        '400':
          description: Missing required fields or invalid agent_type
        '429':
          $ref: '#/components/responses/TooManyRequests'

