components:
  parameters:
    ScreenIdQuery:
      name: screenId
      in: query
      required: false
      schema:
        type: string
      description: Screen identifier
    ScreenIdPath:
      name: screenId
      in: path
      required: true
      schema:
        type: string
    CreativeIdPath:
      name: creativeId
      in: path
      required: true
      schema:
        type: string
    CampaignIdPath:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ExperimentIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Bearer token missing or invalid
    ApiKeyUnauthorized:
      description: API key missing or invalid
  schemas:
    BidRequest:
      type: object
      required: [id, imp]
      properties:
        id:
          type: string
          description: Unique bid request ID
        imp:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
                description: Impression ID
              video:
                type: object
                properties:
                  mimes:
                    type: array
                    items:
                      type: string
                    example: ['video/mp4']
                  w:
                    type: integer
                    example: 1920
                  h:
                    type: integer
                    example: 1080
                  protocols:
                    type: array
                    items:
                      type: integer
                    example: [2, 5]
              bidfloor:
                type: number
                example: 2.50
              bidfloorcur:
                type: string
                default: USD
        dooh:
          type: object
          description: DOOH-specific placement context (OpenRTB 2.6)
          properties:
            venue:
              type: object
              properties:
                type:
                  type: array
                  items:
                    type: string
            device:
              type: object
              properties:
                dth:
                  type: integer
                  description: Device type hint (4=tablet, 7=set-top-box)
        site:
          type: object
          description: Web placement context
        app:
          type: object
          description: App placement context
        device:
          type: object
          properties:
            ua:
              type: string
            ip:
              type: string
            geo:
              type: object
              properties:
                lat:
                  type: number
                lon:
                  type: number
                country:
                  type: string
        tmax:
          type: integer
          description: Maximum response time in ms
          default: 500
      example:
        id: br-001
        imp:
          - id: imp-1
            video:
              mimes: ['video/mp4']
              w: 1920
              h: 1080
            bidfloor: 2.50
        dooh:
          venue:
            type: ['transit']
        tmax: 500

    BidResponse:
      type: object
      properties:
        id:
          type: string
          description: Matches bid request ID
        seatbid:
          type: array
          items:
            type: object
            properties:
              bid:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    impid:
                      type: string
                    price:
                      type: number
                    adid:
                      type: string
                    adm:
                      type: string
                      description: VAST XML or ad markup
                    w:
                      type: integer
                    h:
                      type: integer
                    crid:
                      type: string
                      description: Creative ID
              seat:
                type: string
        cur:
          type: string
          default: USD
      example:
        id: br-001
        seatbid:
          - bid:
              - id: bid-1
                impid: imp-1
                price: 3.25
                adid: ad-123
                w: 1920
                h: 1080
                crid: cr-456
            seat: trillboards
        cur: USD

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT bearer token for protected analytics/admin routes
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: FEIN API key with read or write permissions
