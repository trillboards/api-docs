        campaignId:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,128}$'
        creativeId:
          type: string
        advertiserId:
          type: string
        dspPartner:
          type: string
          description: DSP name (e.g. "thetradedesk", "dv360")
        eventType:
          type: string
          enum: [impression, click, complete]
          default: impression
        placementId:
          type: string
        clickUrl:
          type: string
          format: uri

    TransactionEventRequest:
      type: object
      required: [maidHash, campaignId]
      properties:
        maidHash:
          type: string
          description: SHA-256 hash of the mobile advertising ID
        campaignId:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,128}$'
        advertiserId:
          type: string
        transactionAmountCents:
          type: integer
          description: Transaction amount in cents
        basketItems:
          type: array
          items:
            type: object
            properties:
