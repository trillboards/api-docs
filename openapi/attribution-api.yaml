    SignalQuality:
      type: object
      description: |
        Signal quality and coverage metrics for a campaign. Use this to
        assess the reliability and completeness of attribution data.
      properties:
        campaign_id:
          type: string
        signal_coverage:
          type: object
          description: What percentage of impressions have each signal type
          properties:
            attention_coverage_pct:
              type: number
              description: Percentage of exposures with FEIN attention data
            fein_matched_pct:
              type: number
              description: Percentage of exposures successfully joined with FEIN inference
            identity_resolved_pct:
              type: number
              description: Percentage of devices resolved to household/cross-device graph
            footfall_measured_pct:
              type: number
              description: Percentage of exposed devices with footfall outcome data
        signal_freshness:
          type: object
          description: How fresh the signals are (real-time vs batch)
          properties:
            avg_signal_age_seconds:
              type: number
              description: Average age of device signals at time of ingestion
            p95_signal_age_seconds:
              type: number
              description: 95th percentile signal age
        measurement_confidence:
          type: object
          properties:
            exposure_matching_avg_confidence:
              type: number
              minimum: 0
              maximum: 1
            attention_weighted_avg_confidence:
              type: number
              minimum: 0
              maximum: 1
            incrementality_p_value:
              type: number
            bayesian_prob_positive:
              type: number
        data_provenance:
          type: object
          description: Source of each data type for auditability
          properties:
            device_signal_source:
              type: string
              description: Provider of mobile device location signals
            attention_source:
              type: string
              description: Source of attention/engagement signals
            proof_of_play:
              type: string
              description: Cryptographic proof method for ad plays
            identity_graph_depth:
              type: integer
              description: Maximum hop depth in identity resolution graph

